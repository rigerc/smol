<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('contract-data').textContent);

const list=v=>Array.isArray(v)?v:[];

const keyOf=(sect,row)=>row?.id||row?.name||row?.ref||row?.description||'item';
const summary=(sect,row)=>({Screens:row.purpose,Flows:row.description,UI:row.kind,State:row.type||row.expression,Events:row.description,Commands:row.side_effect,Data:row.provider||row.description,Validation:row.message,Evidence:row.classification||row.description}[sect]||'');

function code(obj){return el('pre','code',JSON.stringify(obj,null,2));}
function detailsKV(target,items){const dl=el('dl','');items.forEach(([name,value])=>{append(dl,el('dt','',name),el('dd','',Array.isArray(value)?value.join(', '):typeof value==='object'?JSON.stringify(value):value??'—'));});target.append(dl);dl.querySelectorAll('dt').forEach(x=>{x.parentNode.classList.add('kv')});return dl;}
function fields(target,row,omit=[]){const data=Object.entries(row||{}).filter(([k,v])=>!omit.includes(k)&&!Array.isArray(v)&&v!==null&&typeof v!=='object');const dl=el('dl','kv');for(const [k,v] of data){append(dl,el('dt','',k),el('dd','',v));}target.append(dl);}
function jumpChip(target,section,id,prefix=''){target.append(button(prefix+id,()=>navigate(section,id),'tag linktag'));}
function chipList(target,values,section,title){if(!list(values).length)return;target.append(sectionHeading(title));const wrap=el('div','');list(values).forEach(id=>{if(section)jumpChip(wrap,section,id);else wrap.append(badge(id));});target.append(wrap);}
function sectionHeading(label){return section(label);}
function provenance(target,ref){if(!ref)return;const claims=list(E.claims).filter(c=>c.ref===ref);if(!claims.length)return;target.append(section('Source evidence'));for(const claim of claims){target.append(badge(claim.classification,claim.classification==='observed'?'good':claim.classification==='inferred'?'warn':''));for(const loc of list(claim.sources)){const v=(loc.path||'unknown')+':'+(loc.line_start||'?')+'–'+(loc.line_end||'?');target.append(el('div','small',v));}if(claim.rationale)target.append(el('p','small',claim.rationale));}}
function makeTree(node){const box=el('div','tree');const d=el('details','');d.open=true;const sm=el('summary');sm.append(el('strong','',node.kind||'node'));sm.append(el('span','small','  '+(node.id||'unnamed')));if(node.focusable)sm.append(badge('focusable','good'));d.append(sm);const metadata=el('div','');fields(metadata,node,['children','on','layout']);if(node.on){metadata.append(section('Emits'));Object.entries(node.on).forEach(([gesture,event])=>{metadata.append(el('span','small',gesture+': '));jumpChip(metadata,'Events',event);});}if(node.layout){metadata.append(section('Layout'));metadata.append(code(node.layout));}if(list(node.children).length){for(const child of node.children)metadata.append(makeTree(child));}d.append(metadata);box.append(d);return box;}
function renderScreenDetail(target,row){fields(target,row,['regions','focus_order','keybindings','states']);if(row.min_size)target.append(badge('Minimum terminal: '+row.min_size.cols+' × '+row.min_size.rows));chipList(target,row.states,'Flows','Associated states');chipList(target,row.focus_order,null,'Focus order');if(list(row.keybindings).length){target.append(section('Keybindings'));for(const k of row.keybindings){const line=el('div','');line.append(badge(k.key));jumpChip(line,'Events',k.event);target.append(line);}}target.append(section('Component tree'));for(const root of list(row.regions))target.append(makeTree(root));}
function renderDetail(target,sect,row){target.replaceChildren();if(!row){target.append(el('p','empty','Select an item to inspect its contract.'));return;}
const headline=el('div','boxhead');headline.append(el('span','',keyOf(sect,row)));headline.append(button('Copy JSON',()=>copyText(JSON.stringify(row,null,2)),'btn small'));target.append(headline);
const body=el('div','boxbody');target.append(body);
if(sect==='Screens'){renderScreenDetail(body,row);return;}
fields(body,row,['props','emits','payload','input','outcomes','fields','rules','sources','children','claims','on','updates','commands','guards','gaps']);
if(sect==='UI'){chipList(body,row.emits,'Events','Emitted events');if(list(row.props).length){body.append(section('Props and bindings'));body.append(code(row.props));}provenance(body,'ui.components.'+row.id);}
if(sect==='State'){provenance(body,(row.name?'state.fields.':'state.invariants.')+keyOf(sect,row));}
if(sect==='Events'){body.append(section('Payload schema'));body.append(code(row.payload||{}));provenance(body,'events.'+row.id);}
if(sect==='Commands'){jumpSection(body,'Events',row.trigger,'Trigger');chipList(body,row.outcomes,'Events','Outcomes');body.append(section('Input contract'));body.append(code(row.input||{}));provenance(body,'commands.'+row.id);}
if(sect==='Data'){if(row.model)jumpSection(body,'Data',row.model,'Model');if(row.fields)body.append(code(row.fields));provenance(body,(row.name?'data.models.':'data.sources.')+keyOf(sect,row));}
if(sect==='Validation'){jumpSection(body,'Events',row.when,'Validation trigger');provenance(body,'validation.rules.'+row.id);}
if(sect==='Flows'){
  body.append(section('Transitions from this state'));
  const tr=list(F.transitions).filter(t=>t.from===row.id);
  for(const t of tr){
    const d=el('div','notice');d.style.marginBottom='9px';
    d.append(el('strong','',t.id+' · '));jumpChip(d,'Events',t.event);
    d.append(el('span','small',' → '));jumpChip(d,'Flows',t.to);
    if(t.description)d.append(el('p','small',t.description));
    if(t.guard){const g=list(F.guards).find(x=>x.id===t.guard);d.append(badge('guard: '+t.guard));if(g)d.append(el('p','small',g.expression+' — '+g.description));}
    if(list(t.commands).length){d.append(el('p','small','Effects'));for(const cmd of t.commands)jumpChip(d,'Commands',cmd);}
    if(list(t.updates).length){d.append(el('p','small','State updates'));d.append(code(t.updates));}
    body.append(d);
  }
  const incoming=list(F.transitions).filter(t=>t.to===row.id);
  if(incoming.length){body.append(section('Incoming transitions'));for(const t of incoming){const d=el('div','small');jumpChip(d,'Flows',t.from);d.append(el('span','small',' via '));jumpChip(d,'Events',t.event);body.append(d);}}
}
if(sect==='Evidence'){for(const s of list(row.sources)){body.append(el('div','small',(s.path||'unknown')+':'+(s.line_start||'?')+'-'+(s.line_end||'?')));}if(row.rationale)body.append(el('p','',row.rationale));}
body.append(section('Full definition'));body.append(code(row));
}
function jumpSection(target,sect,id,label){if(!id)return;target.append(section(label));jumpChip(target,sect,id);}
async function copyText(value){try{await navigator.clipboard.writeText(value);flash('Copied JSON');}catch{const ta=el('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy');flash('Copied JSON');}catch{flash('Copy unavailable');}ta.remove();}}
function flash(msg){$('breadcrumbs').textContent=msg;setTimeout(()=>$('breadcrumbs').textContent='Explore / '+state.section,1500);}
function renderNav(){const nav=$('navigation');nav.replaceChildren();nav.append(el('div','nav-label','Sections'));for(const sec of headings){const n=sec==='Overview'?0:SECTION[sec].filter(row=>matches(sec,row)).length;const b=button(sec,()=>navigate(sec),'navbtn'+(state.section===sec?' active':''));b.append(el('span','counter',sec==='Overview'?'':n));nav.append(b);}}
function renderOverview(target){const m=el('div','metrics');[['Screens',SECTION.Screens.length],['Flow states',SECTION.Flows.length],['UI contracts',SECTION.UI.length],['Events',SECTION.Events.length],['Commands',SECTION.Commands.length],['Validation rules',SECTION.Validation.length]].forEach(([label,num])=>{const t=el('div','metric');append(t,el('strong','',num),el('span','',label));m.append(t);});target.append(m);
const overview=el('div','box');overview.append(el('div','boxhead','Package summary'));const body=el('div','boxbody');overview.append(body);fields(body,M,['files','assumptions','open_questions']);if(list(M.open_questions).length){body.append(section('Open questions'));list(M.open_questions).forEach(v=>body.append(el('p','subtle',v)));}if(list(M.assumptions).length){body.append(section('Assumptions'));list(M.assumptions).forEach(v=>body.append(el('p','subtle',v)));}target.append(overview);
const valid=el('div','box');valid.style.marginTop='16px';valid.append(el('div','boxhead','Validation'));const vb=el('div','boxbody');valid.append(vb);if(Object.keys(R).length){vb.append(badge(R.status||'unknown',R.status==='pass'?'good':'bad'));vb.append(el('span','small',' '+(R.error_count||0)+' errors · '+(R.warning_count||0)+' warnings'));for(const issue of list(R.errors))vb.append(el('p','',issue));for(const issue of list(R.warnings))vb.append(el('p','subtle',issue));}else vb.append(el('p','subtle','No validation report is embedded. Run build to validate and refresh the viewer.'));target.append(valid);
}
function renderGraph(target){const states=list(F.states),transitions=list(F.transitions);if(!states.length)return;
const g=el('div','graphwrap');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const levels=new Map([[F.initial||states[0].id,0]]);for(let k=0;k<states.length;k++){let changed=false;for(const t of transitions){if(levels.has(t.from)&&!levels.has(t.to)){levels.set(t.to,levels.get(t.from)+1);changed=true;}}if(!changed)break;}states.forEach((s,i)=>{if(!levels.has(s.id))levels.set(s.id,i+1);});const buckets=new Map();for(const s of states){const level=levels.get(s.id);if(!buckets.has(level))buckets.set(level,[]);buckets.get(level).push(s);}
const pos=new Map(),maxCols=Math.max(...[...buckets.values()].map(b=>b.length));const w=Math.max(640, maxCols*220+70),h=Math.max(145,(Math.max(...buckets.keys())+1)*130+35);svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','State transition graph');
for(const [depth,arr] of buckets){arr.forEach((s,i)=>pos.set(s.id,{x:35+i*(w-70)/arr.length,y:22+depth*130,w:Math.min(190,(w-70)/arr.length-10),h:65}));}
const ns='http://www.w3.org/2000/svg',node=(tag,attrs={})=>{const x=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x;};const defs=node('defs'),marker=node('marker',{id:'arrow',markerWidth:9,markerHeight:9,refX:7,refY:4,orient:'auto'});marker.append(node('path',{d:'M 0 0 L 8 4 L 0 8 z',fill:'var(--muted)'}));defs.append(marker);svg.append(defs);
for(const t of transitions){const a=pos.get(t.from),b=pos.get(t.to);if(!a||!b)continue;let x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y;if(t.to===t.from){x1=a.x+a.w;y1=a.y+a.h/2;x2=x1;y2=y1-17;}const line=node('path',{d:`M ${x1} ${y1} Q ${(x1+x2)/2+35} ${(y1+y2)/2} ${x2} ${y2}`,fill:'none',stroke:'var(--muted)','stroke-width':1.4,'marker-end':'url(#arrow)',opacity:.7});svg.append(line);}
for(const s of states){const p=pos.get(s.id);const n=node('g',{class:'node-graph',tabindex:0,role:'button','aria-label':'Inspect state '+s.id});n.append(node('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:9,fill:'var(--panel2)',stroke:state.selected===s.id?'var(--accent)':'var(--border)','stroke-width':state.selected===s.id?3:1}));const label=node('text',{x:p.x+10,y:p.y+27,fill:'var(--text)','font-size':13,'font-weight':600});label.textContent=s.id.length>23?s.id.slice(0,22)+'…':s.id;n.append(label);const foot=node('text',{x:p.x+10,y:p.y+46,fill:'var(--muted)','font-size':11});foot.textContent=s.screen||'state';n.append(foot);n.addEventListener('click',()=>navigate('Flows',s.id));n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();navigate('Flows',s.id);}});svg.append(n);}
g.append(svg);target.append(g);target.append(el('p','graph-caption','Click or press Enter on a state to inspect transitions. Edges show possible transitions; labels and guards appear in the detail pane.'));
}
function renderCollection(target,sect){if(sect==='Flows'){target.append(el('h3','', 'Interactive state graph'));renderGraph(target);}const l=SECTION[sect].filter(row=>matches(sect,row));const wrap=el('div','layout');const master=el('div','box'),detail=el('div','box');master.append(el('div','boxhead',sect+' · '+l.length));const entries=el('div','collection');master.append(entries);if(!l.length)entries.append(el('p','empty',state.query?'No matches. Clear your search.':'No entries in this section.'));
const selected=l.find(r=>keyOf(sect,r)===state.selected)||l[0];for(const row of l){const key=keyOf(sect,row);const b=button(key,()=>navigate(sect,key),'item'+(row===selected?' active':''));const s=summary(sect,row);if(s)b.append(el('small','',String(s).slice(0,145)));entries.append(b);}renderDetail(detail,sect,selected);wrap.append(master,detail);target.append(wrap);}
function render(){const sect=headings.includes(state.section)?state.section:'Overview';$('rail-title').textContent=M.title||M.feature_id||'Untitled feature';$('rail-meta').textContent=(M.source_mode||'brief')+' · '+(M.artifact_scope||'full');$('heading').textContent=sect==='Overview'?(M.title||'Contract overview'):sect;$('eyebrow').textContent=sect==='Overview'?'Specification bundle':'Explore contracts';$('description').textContent=sect==='Overview'?M.source_brief||'Inspect screens, flows, interface contracts and provenance.':`Explore ${sect.toLowerCase()} for ${M.feature_id||'this feature'}.`;$('breadcrumbs').textContent='Explore / '+sect;document.title=(M.title||'TUI')+' · '+sect+' · Contract Explorer';const badges=$('badges');badges.replaceChildren(badge(M.status||'draft',M.status==='ready'?'good':'warn'),badge(M.source_mode||'brief'),badge(M.artifact_scope||'full'));renderNav();const content=$('content');content.replaceChildren();if(sect==='Overview')renderOverview(content);else renderCollection(content,sect);}
$('search').addEventListener('input',e=>{state.query=e.target.value;render();});$('theme').addEventListener('click',()=>{const light=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=light?'dark':'light';});$('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download=(M.feature_id||'tui')+'-contracts-export.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);});render();
})();
</script>
